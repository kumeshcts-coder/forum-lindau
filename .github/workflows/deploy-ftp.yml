# Deploys the site to the FTP server (forum.entwicklung-loewenmut.ch)
# every time code is pushed to the main branch.
#
# Required repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER     – FTP host name only, e.g. ftp.example.ch (no "ftp://")
#   FTP_USERNAME   – FTP user
#   FTP_PASSWORD   – FTP password
# Optional:
#   FTP_SERVER_DIR – folder on the server that holds index.html, ending with "/"
#                    (e.g. "httpdocs/"). Defaults to the FTP login folder "./".

name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual "Run workflow" from the Actions tab

# Never run two uploads at the same time
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload changed files
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          # Only changed files are uploaded (state is kept in .ftp-deploy-sync-state.json on the server)
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            ftp_details.txt
